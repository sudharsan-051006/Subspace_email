<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Email</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #1a1a18;
    }

    .card {
      background: #ffffff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      width: 100%;
      max-width: 680px;
      overflow: hidden;
    }

    .card-header {
      padding: 1.5rem 1.75rem 1.25rem;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
    }
    .card-header-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-wrap {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: #e6f1fb;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-wrap i { font-size: 18px; color: #185fa5; }
    .card-title { font-size: 16px; font-weight: 500; }
    .card-subtitle { font-size: 13px; color: #6b6b68; margin-top: 2px; }

    .recipients-bar {
      padding: 1rem 1.75rem;
      border-bottom: 0.5px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .rec-label { font-size: 13px; color: #6b6b68; white-space: nowrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f5f4f0;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
    }
    .pill i { font-size: 13px; color: #888; }
    .pill-count {
      background: #e6f1fb; color: #185fa5;
      border-radius: 12px; padding: 2px 8px;
      font-size: 11px; font-weight: 500;
    }

    .form-body {
      padding: 1.5rem 1.75rem;
      display: flex; flex-direction: column; gap: 1.25rem;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label {
      font-size: 13px; font-weight: 500; color: #6b6b68;
      display: flex; align-items: center; gap: 6px;
    }
    .field label i { font-size: 15px; }

    .field input,
    .field textarea {
      width: 100%;
      background: #f5f4f0;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a18;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      resize: vertical;
    }
    .field input:focus,
    .field textarea:focus {
      border-color: #378add;
      box-shadow: 0 0 0 3px rgba(55,138,221,0.12);
    }
    .field textarea { line-height: 1.6; min-height: 320px; }
    .char-count { font-size: 12px; color: #9a9994; text-align: right; }

    .footer {
      padding: 1.25rem 1.75rem;
      border-top: 0.5px solid rgba(0,0,0,0.1);
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .footer-info { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #6b6b68; }
    .footer-info i { font-size: 15px; }

    .btn-send {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1a1a18; color: #ffffff;
      border: none; border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px; font-weight: 500; font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-send:hover { opacity: 0.85; }
    .btn-send:active { transform: scale(0.98); }
    .btn-send i { font-size: 16px; }

    .btn-discard {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent;
      border: 0.5px solid rgba(0,0,0,0.2);
      border-radius: 8px; padding: 10px 16px;
      font-size: 13px; color: #6b6b68; font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-discard:hover { background: #f5f4f0; }

    @media (max-width: 480px) {
      .footer { flex-direction: column; align-items: stretch; }
      .footer > div { width: 100%; }
      .btn-send, .btn-discard { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="card-header">
      <div class="card-header-top">
        <div class="icon-wrap"><i class="ti ti-mail-forward" aria-hidden="true"></i></div>
        <div>
          <div class="card-title">Send generated email</div>
          <div class="card-subtitle">Review and send to all selected leads</div>
        </div>
      </div>
    </div>

    <div class="recipients-bar">
      <span class="rec-label">To</span>
      {% for email in emails %}
        <span class="pill"><i class="ti ti-user" aria-hidden="true"></i>{{ email }}</span>
      {% endfor %}
    </div>

    <form method="POST" action="/send-generated-email/">
      {% csrf_token %}

      {% for email in emails %}
        <input type="hidden" name="emails" value="{{ email }}">
      {% endfor %}

      <div class="form-body">

        <div class="field">
          <label for="subject">
            <i class="ti ti-text-size" aria-hidden="true"></i> Subject
          </label>
          <input
            type="text"
            id="subject"
            name="subject"
            value="{{ subject }}"
            placeholder="Enter email subject…"
            oninput="document.getElementById('subj-count').textContent = this.value.length + ' characters'"
          >
          <span class="char-count" id="subj-count"></span>
        </div>

        <div class="field">
          <label for="generated_email">
            <i class="ti ti-align-left" aria-hidden="true"></i> Email body
          </label>
          <textarea
            id="generated_email"
            name="generated_email"
            rows="16"
            placeholder="Your generated email will appear here…"
            oninput="document.getElementById('body-count').textContent = this.value.length + ' characters'"
          >{{ generated_email }}</textarea>
          <span class="char-count" id="body-count"></span>
        </div>

      </div>

      <div class="footer">
        <div class="footer-info">
          <i class="ti ti-send" aria-hidden="true"></i>
          Will be sent to <strong style="color:#1a1a18; margin-left:3px;">{{ emails|length }} lead{{ emails|length|pluralize }}</strong>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-discard">
            <i class="ti ti-x" aria-hidden="true"></i> Discard
          </button>
          <button type="submit" class="btn-send">
            <i class="ti ti-send" aria-hidden="true"></i> Send to all leads
          </button>
        </div>
      </div>

    </form>
  </div>

  <script>
    const subjectInput = document.getElementById('subject');
    const bodyInput = document.getElementById('generated_email');
    document.getElementById('subj-count').textContent = subjectInput.value.length + ' characters';
    document.getElementById('body-count').textContent = bodyInput.value.length + ' characters';
  </script>

</body>
</html>
